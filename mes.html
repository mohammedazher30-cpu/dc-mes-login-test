<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC MES · Test (Supabase)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f4;--panel:#fff;--ink:#1c2330;--muted:#667085;--line:#e3e6eb;
  --side:#0f2e22;--side-ink:#cfe3d8;--accent:#138a52;--accent-soft:#e3f4ea;
  --ok:#0f9d58;--ok-soft:#e3f6ec;--warn:#b25e00;--warn-soft:#fdf1e2;--bad:#c23030;--bad-soft:#fbe9e9;--grey-soft:#eef0f3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
[dir=rtl] body,[dir=rtl]{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;align-self:start}
.brand{color:#fff;font-weight:600;font-size:17px;padding:4px 10px 16px;letter-spacing:.2px}
.brand small{display:block;color:#8fb7a2;font-weight:400;font-size:12px;margin-top:2px}
.nav button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--side-ink)}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:12px 12px 4px;color:var(--side-ink);font-weight:600}
.nav button:hover{background:#18452f}
.nav button.active{background:var(--accent);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.side-foot button{all:unset;cursor:pointer;font-size:12px;color:#9cc4ae;padding:4px 0}
.side-foot button:hover{color:#fff}
main{padding:22px 26px;overflow:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;margin:0;font-weight:600}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.kpi .v{font-size:26px;font-weight:600;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12.5px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{padding:4px 10px}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav button{width:auto}.side-foot{flex-direction:row;margin:0}.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:#2f5e45;font-weight:500;background:#f1f8f3}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
tr.sel td{background:var(--accent-soft)}
.num{text-align:end;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-close{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}.p-grey{background:var(--grey-soft);color:#475467}.p-blue{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:7px;background:var(--accent);color:#fff;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent);border-color:var(--accent);font-weight:500}
.muted{color:var(--muted)}
.bar{height:7px;background:var(--grey-soft);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ok)}
.wotbl{min-width:860px}.wotbl td:first-child,.wotbl td:nth-child(5){white-space:nowrap}.wotbl td:nth-child(2){min-width:170px}
.split{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin-bottom:14px}
.kv div:nth-child(odd){color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.mach{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.mach:last-child{border:0}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px}
.modal.wide{width:min(1000px,100%)}
.wo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}.wo-grid .field>select,.wo-grid .field>input{width:100%;min-width:0}.modal{overflow-x:hidden}
@media(max-width:700px){.wo-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:12.5px;color:var(--muted)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
.short{color:var(--bad);font-weight:500}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 4px}
.rc{display:inline-flex;flex-direction:column;align-items:center;font-size:11.5px;padding:5px 9px;border-radius:8px;background:var(--grey-soft);color:var(--muted);line-height:1.2;font-weight:500}
.rc small{font-weight:400;font-size:10.5px}
.rc-done{background:var(--ok-soft);color:var(--ok)}.rc-running{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 2px var(--warn)}.rc-ready{background:var(--warn-soft);color:var(--warn)}.rc-late{background:var(--bad-soft);color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.rc-arrow{color:var(--muted);font-size:12px}
.stepbox{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.readybox{border:2px dashed var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#fff}
.kpi-go{cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.kpi-go:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(16,24,40,.08)}
.kpi-arrow{position:absolute;top:12px;inset-inline-end:14px;color:var(--muted);opacity:0;transition:opacity .12s}
.kpi-go:hover .kpi-arrow{opacity:1;color:var(--accent)}
.wolink{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px}
.chip b{cursor:pointer}
.mpic{border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;background:#f1f4f3;color:#46546a;border:2px solid transparent}
.mpic img{width:100%;height:100%;object-fit:cover}
.ms-run{border-color:var(--ok)}.ms-stop{border-color:var(--bad);color:var(--bad)}.ms-out{border-color:#c9ced6;opacity:.75}
.mpic-wrap{position:relative}
.mpic-btn{all:unset;cursor:pointer;position:absolute;inset-inline-end:-6px;bottom:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:24px;height:24px;font-size:12px;text-align:center;line-height:24px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mpic-btn:hover{border-color:var(--accent)}
.linkbtn{all:unset;cursor:pointer;font-size:11.5px;color:var(--bad)}
.mtiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.mtile{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:92px;max-width:110px;text-align:center;font-size:12px;line-height:1.2}
.mtile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
[data-zoom]{cursor:zoom-in}.mtile [data-zoom]{cursor:pointer}
#zoomPop{position:fixed;z-index:20;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.22);padding:8px;pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .12s,transform .12s}
#zoomPop.on{opacity:1;transform:scale(1)}
#zoomPop img{width:100%;border-radius:8px;display:block;max-height:220px;object-fit:cover}
.zp-icon{height:190px;display:flex;align-items:center;justify-content:center;background:#f1f4f3;border-radius:8px;color:#46546a}
.zp-cap{font-size:12.5px;padding:8px 4px 2px}
.wsgrid .mach{align-items:center}
.stepper{display:flex;flex-wrap:wrap;gap:4px}.stepper span{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--grey-soft);color:var(--muted)}
.stepper span.done{background:var(--ok-soft);color:var(--ok)}.stepper span.cur{background:var(--accent);color:#fff;font-weight:600}
.scanbox{display:flex;gap:8px;margin:8px 0 10px;padding:10px;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft)}
.scanbox input{flex:1;font-size:16px}
.actbar{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-weight:500}
.podbox{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.label{display:flex;gap:12px;border:1px solid #000;border-radius:6px;padding:10px;background:#fff;color:#000;break-inside:avoid}
.qr{width:96px;height:96px;flex:none}.qr img,.qr canvas{width:96px!important;height:96px!important}
.qr-fallback{width:96px;height:96px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;word-break:break-all}
@media print{body.print-main *{visibility:visible!important}body.print-main aside,body.print-main .noprint,body.print-main .toast{display:none!important}body.print-main .app{display:block}body.print-main main{padding:0}body:not(.print-main) *{visibility:hidden}body:not(.print-main) .modal,body:not(.print-main) .modal *{visibility:visible}.modal{position:absolute;inset:0;width:100%!important;max-height:none}.modal .btn{display:none}}
body.locked aside{display:none}body.locked .app{grid-template-columns:1fr}
.login{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:min(560px,100%)}
.login-brand{text-align:center;margin-bottom:16px}.login-brand img{max-width:160px;margin:0 auto}
.login-users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-user{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px}
.login-user span{font-size:12px;color:var(--muted)}.login-user:hover,.login-user.on{border-color:var(--accent);background:var(--accent-soft)}
.userbox{border-top:1px solid rgba(128,128,128,.25);padding-top:10px;margin-bottom:6px}
.ub-name{font-weight:600;font-size:13px}.ub-role{font-size:11.5px;opacity:.75;margin:2px 0 4px}
.art-wrap{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.art-wrap{grid-template-columns:1fr}}
.art-tree{padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 44px);position:sticky;top:0}
.art-tree-head{background:var(--accent);color:#fff;font-weight:600;padding:12px;border-radius:10px 10px 0 0;text-align:center}
.art-tree-body{overflow:auto;padding:6px 4px;flex:1}
.tr-row{padding:6px 8px;cursor:pointer;border-radius:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row:hover{background:var(--accent-soft)}.tr-row.on{background:var(--accent);color:#fff}.tr-row.on .muted{color:#e8f5ee}
.tr-l2{padding-inline-start:22px}.tr-l3{padding-inline-start:44px}
.chev{display:inline-block;width:14px;color:var(--muted)}
.doc-tabs{display:flex;gap:4px;flex-wrap:wrap}
.doc-tab{background:var(--grey-soft);padding:7px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px}
.doc-tab.on{background:var(--side);color:var(--side-ink);border:1px solid var(--line);border-bottom:0;font-weight:500}
.doc-tab b{margin-inline-start:6px;color:var(--muted);font-weight:400}
.sub-tabs,.bottom-tabs{display:flex;gap:4px;align-items:center;padding:8px 10px;background:#f6f8f7;border-bottom:1px solid var(--line)}
.bottom-tabs{border-top:1px solid var(--line);margin-top:4px}
.sub-tabs button:not(.btn),.bottom-tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;color:var(--muted)}
.sub-tabs button.on,.bottom-tabs button.on{background:#fff;color:var(--accent);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.kf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media(max-width:800px){.kf-grid{grid-template-columns:1fr}}
.kf{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.kf>span{background:#f1f4f3;color:#475467;font-size:12.5px;padding:9px 10px;min-width:118px;align-self:stretch;display:flex;align-items:center}
.kf input,.kf select,.kf textarea{border:0;border-radius:0;flex:1;min-width:0;font:inherit;padding:8px 10px}
.kf input:disabled{background:#fafafa;color:var(--muted)}
.diag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px}
.dnode{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:140px;background:#fff}
.dnode.dfin{background:var(--accent);color:#fff;border-color:var(--accent)}
.dop{font-weight:600;font-size:13px}.dmat{margin-top:6px;font-size:11.5px;color:var(--accent);border-top:1px dashed var(--line);padding-top:5px}
.darrow{color:var(--muted);font-size:20px}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;margin-inline-start:4px}
.term-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.term-top select{font-size:15px;padding:10px 12px}
.term{display:grid;grid-template-columns:1.15fr 1.3fr 0.85fr;gap:14px;align-items:start}
.job>div:first-child{min-width:0;flex:1}
@media(max-width:1150px){.term{grid-template-columns:1fr}}
.job{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.job:hover{border-color:var(--accent)}.job.sel{border-color:var(--accent);background:var(--accent-soft)}
.big{font-size:17px;padding:14px 20px;border-radius:10px}
.counter{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0}
.counter button{all:unset;cursor:pointer;width:58px;height:58px;border-radius:12px;background:var(--grey-soft);font-size:28px;text-align:center;line-height:58px;font-weight:600}
.counter button:active{transform:scale(.96)}
.counter .val{font-size:38px;font-weight:600;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.cnt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cnt-box{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.cnt-box .l{color:var(--muted);font-size:13px}
.reason-pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.reason-pad button{all:unset;cursor:pointer;padding:18px 12px;border-radius:10px;border:1px solid var(--line);text-align:center;font-weight:500}
.rp-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.rp-g{border:1px solid var(--line);border-radius:10px;padding:8px}.rp-g.rp-plan{background:var(--warn-soft);border-color:#f3d3a8}.rp-h{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}.reason-pad.compact{grid-template-columns:1fr 1fr}.reason-pad.compact button{padding:11px 8px;font-size:13px;background:#fff}
.sb-planned{background:var(--warn-soft);color:var(--warn)}.ms-plan{border-color:var(--warn);color:var(--warn)}
.reason-pad button:hover{border-color:var(--bad);background:var(--bad-soft)}.reason-pad button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.reason-pad button.on .muted{color:#e3f4ea}.reason-pad button.on::before{content:"✓ "}
.state-banner{padding:10px 14px;border-radius:9px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sb-run{background:var(--ok-soft);color:var(--ok)}.sb-stopped{background:var(--bad-soft);color:var(--bad)}.sb-out{background:var(--grey-soft);color:#475467}
.var-pos{color:var(--bad);font-weight:500}.var-neg{color:var(--ok);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand" data-t="brand">MES Demo<small data-t="phase">Phase 2 · Shop floor</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div id="userBox" class="userbox"></div>
      <button id="langBtn">العربية</button>
      <button id="resetBtn" data-t="reset">Reset demo data</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

function ensureTasks(){const V={"P-001":"Riyadh Front Exhibition Center, Hall 3","P-002":"King Abdullah Park, Riyadh","P-003":"Malls – Riyadh / Jeddah / Dammam","P-004":"Dhahran Expo","P-005":"Al-Ula"};db.projects.forEach(p=>{if(p.venue===undefined&&V[p.id])p.venue=V[p.id]});if(!db.tasks){db.tasks=seedTasks();db.seq.task=18;persist()}db.seq.task=db.seq.task||db.tasks.length}
const teamName=id=>id==="SITE"?t("siteTeam"):id==="PM"?t("role_pm"):id==="ENG"?t("teamEng"):id==="PROC"?t("teamProc"):wsName(id);
const taskBlockedBy=tk=>(tk.deps||[]).map(i=>by(db.tasks,i)).filter(x=>x&&x.status!=="done");
const todayISO=()=>d(0);
function taskState(tk){if(tk.status==="done")return"done";if(taskBlockedBy(tk).length)return"blocked";if(typeof taskWorkDone==="function"&&taskWorkDone(tk))return"toclose";if(tk.end<todayISO())return"late";return tk.status==="inprog"?"inprog":"ready"}
const TS_PILL={done:"p-ok",blocked:"p-grey",late:"p-bad",inprog:"p-warn",ready:"p-grey",toclose:"p-close"};
const tsPill=tk=>{const s=taskState(tk);return `<span class="pill ${TS_PILL[s]}">${s==="blocked"?"⏳ "+t("waitingFor")+" "+taskBlockedBy(tk).map(x=>"#"+x.no).join(", "):t("ts_"+s)}</span>`};
const projTasks=pid=>(db.tasks||[]).filter(x=>x.project===pid).sort((a,b)=>a.no-b.no);
const tNo=id=>{const x=by(db.tasks,id);return x?"#"+x.no:""};
function woChip(id){const w=by(db.workorders,id);if(!w)return"";return `<span class="pill ${w.status==="Completed"?"p-ok":w.status==="Cancelled"?"p-grey":"p-warn"}" style="margin:2px 4px 2px 0">${esc(w.id)} · ${w.done}/${w.planned}</span>`}
function projStats(pid){const ts=projTasks(pid),st=ts.map(taskState);return{total:ts.length,done:st.filter(s=>s==="done").length,blocked:st.filter(s=>s==="blocked").length,late:st.filter(s=>s==="late").length,ready:ts.filter(x=>["ready","inprog","late"].includes(taskState(x)))}}

function ganttHtml(p,ts){
  if(!ts.length)return `<div class="card empty">${t("noTasks")}</div>`;
  const dates=ts.flatMap(x=>[x.start,x.end]).concat([p.eventDate,todayISO()]).sort();
  const t0=new Date(dates[0]),t1=new Date(dates[dates.length-1]);t1.setDate(t1.getDate()+1);
  const span=(t1-t0)/864e5,pos=iso=>((new Date(iso)-t0)/864e5)/span*100,days=[];
  for(let i=0;i<span;i++){const x=new Date(t0);x.setDate(x.getDate()+i);days.push(x)}
  const COL={done:"var(--ok)",blocked:"#c9ced6",late:"var(--bad)",inprog:"var(--warn)",ready:"#98a2b3",toclose:"#7fc89a"};
  const marker=(iso,label,c)=>`<div style="position:absolute;top:0;bottom:0;left:${pos(iso)}%;border-left:2px dashed ${c};z-index:1"><span style="position:absolute;top:-18px;left:2px;font-size:10.5px;color:${c};white-space:nowrap;font-weight:600">${label}</span></div>`;
  return `<div class="card" style="overflow:auto"><div style="min-width:780px">
   <div style="display:grid;grid-template-columns:230px 1fr;gap:0 10px;align-items:center">
    <div></div><div style="position:relative;height:22px;display:flex;font-size:10.5px;color:var(--muted)">${days.map(x=>`<div style="flex:1;text-align:center;border-left:1px solid var(--line)">${x.getDate()}/${x.getMonth()+1}</div>`).join("")}</div>
    ${ts.map(tk=>{const st=taskState(tk),l=pos(tk.start),w=Math.max(pos(tk.end)-l+100/span,100/span*0.6);
     return `<div style="font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>#${tk.no}</b> ${esc(tk.name)}${tk.deps.length?` <span class="muted">← ${tk.deps.map(tNo).join(",")}</span>`:""}</div>
     <div style="position:relative;height:30px;border-top:1px solid var(--line)">${marker(todayISO(),"",'#98a2b3')}${marker(p.eventDate,"",'var(--bad)')}<div title="${esc(tk.name)} · ${tk.start} → ${tk.end}" style="position:absolute;top:6px;height:18px;left:${l}%;width:${w}%;background:${COL[st]};border-radius:5px;color:#fff;font-size:10.5px;line-height:18px;padding:0 6px;white-space:nowrap;overflow:hidden">${st==="blocked"?"🔒 ":""}${t("ts_"+st)}</div></div>`}).join("")}
   </div>
   <div class="row" style="margin-top:12px;font-size:12px;gap:14px">${Object.keys(COL).map(k=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COL[k]}"></span> ${t("ts_"+k)}</span>`).join("")}<span><span style="display:inline-block;width:10px;border-top:2px dashed #98a2b3"></span> ${t("today")}</span><span><span style="display:inline-block;width:10px;border-top:2px dashed var(--bad)"></span> ${t("eventDate")}</span></div>
  </div></div>`;
}

const BIDI_RE=/(?<![⁦\w])([A-Za-z0-9]+(?:[-–\/:][A-Za-z0-9]+)+)(?![⁩\w])/g;
function fixBidi(root){if(lang!=="ar"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];while((n=w.nextNode())){const v=n.nodeValue;if(v&&/[-–\/:]/.test(v)&&/\d/.test(v)){const nv=v.replace(BIDI_RE,"⁦$1⁩");if(nv!==v)todo.push([n,nv])}}todo.forEach(([x,v])=>x.nodeValue=v)}

    if(!data.session){me=null;sbBooting=false;render();return}
    const u=await sbProfileToMe();
    if(u===false){await SB.auth.signOut({scope:"local"});me=null;sbBooting=false;ui.sbMsg="Your account is not active in the MES. Contact your admin.";render();return}
    if(!u)throw new Error("Could not read your profile. Check your connection and try again.");
    $("#main").innerHTML=`<div class="empty">Loading from Supabase…</div>`;
    const s3=await sbLoadMaster();
    const s2=await sbLoadProjects();
    sbUid=data.session.user.id;
    const s4=await sbLoadProducts();
    const s5=await sbLoadWOs();
    u.ws=u.wsIds.map(id=>sbMap.ws[id]).filter(Boolean);u.op=u.opId?(sbMap.op[u.opId]||""):"";
    sbLastSync=new Date();
    db.syncLog=db.syncLog||[];db.syncLog.unshift({at:sbLastSync.toISOString(),dir:"in",msg:`Supabase: ${s3.w} workshops, ${s3.m} stations, ${s3.a} assets, ${s3.o} team leaders, ${s3.raw} raw materials · ${s2.p} project(s), ${s2.t} tasks, ${s2.d} dependencies · ${s4.n} products, ${s5.n} work orders`});
    _sbPersist();
    me=u;sbBooting=false;if(!myViews().includes(view))view=myViews()[0];render();
  }catch(e){sbBooting=false;console.error(e);$("#main").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto"><h2>Could not load data from Supabase</h2><p class="muted">${esc(e.message||String(e))}</p><button class="btn" onclick="location.reload()">Try again</button></div>`}
}
loginScreen=function(){
  document.body.classList.add("locked");
  const m=ui.sbMsg||"";ui.sbMsg="";
  $("#main").innerHTML=`<div class="login"><div class="login-card" style="max-width:420px">
    <div class="login-brand">${document.querySelector(".logo")?document.querySelector(".logo").innerHTML:""}<h1 style="margin:6px 0 2px">${t("brand")}</h1><div class="muted">${t("signIn")} · test (Supabase)</div></div>
    <div id="sbStep1"><label class="muted" style="font-size:12px">Company email</label>
      <input id="sbEmail" type="email" placeholder="name@dcevent.com" style="width:100%;margin:4px 0 10px" autocomplete="email">
      <button class="btn big" id="sbSend" style="width:100%">Send sign-in link</button></div>
    <div class="note" id="sbMsg" style="text-align:center;margin-top:12px;${m?"color:var(--bad)":""}">${esc(m)}</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn sec sm" id="langBtn2">${t("lang")}</button></div>
  </div></div>`;
  const send=async()=>{const email=$("#sbEmail").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){$("#sbMsg").textContent="Enter a valid email";$("#sbMsg").style.color="var(--bad)";return}
    $("#sbSend").disabled=true;
    const {error}=await SB.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
    $("#sbSend").disabled=false;
    if(error){$("#sbMsg").textContent=/signups not allowed|Signups/i.test(error.message)?"This email has no MES account. Ask your admin to invite you.":/rate|too many/i.test(error.message)?"Too many sign-in emails were sent. Wait a while and try again.":error.message;$("#sbMsg").style.color="var(--bad)";return}
    $("#sbMsg").style.color="";$("#sbMsg").textContent="Email sent. Open it in this same browser and click Sign in (check spam too).";};
  $("#sbSend").onclick=send;$("#sbEmail").onkeydown=e=>{if(e.key==="Enter")send()};
  $("#langBtn2").onclick=()=>{$("#langBtn").click()};
};
logout=async function(){if(!confirm("Log out of the MES?"))return;me=null;ui.tWarn=null;try{await SB.auth.signOut({scope:"local"})}catch(e){}render()};
const _sbRenderUser=renderUser;
renderUser=function(){_sbRenderUser();const e=$("#userBox");if(e&&sbLastSync&&!e.querySelector(".sbstat"))e.insertAdjacentHTML("beforeend",`<div class="sbstat" style="font-size:11px;margin-top:6px;opacity:.8">● Supabase · ${sbLastSync.toLocaleTimeString()}</div>`)};
SB.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!me)setTimeout(sbBoot,0);if(ev==="SIGNED_OUT"&&me){me=null;console.warn("[MES] signed out");setTimeout(render,0)}});
me=null;
sbBoot();

</script>
